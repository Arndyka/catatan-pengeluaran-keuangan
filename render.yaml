services:
  - type: web
    name: spendly-nvidia-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend_nvidia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_ACCESS_TOKEN
        generateValue: true
      - key: REQUIRE_AI_ACCESS_TOKEN
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://arndyka.github.io
      - key: NVIDIA_TEXT_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_VISION_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: MAX_CANDIDATES_PER_REQUEST
        value: "50"
